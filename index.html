<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Recordatorios de Salud</title>
  <style>
    body { font-family: sans-serif; background:#f0f2f5; padding:20px; color: #333; }
    .card { background:#fff; padding:15px; border-radius:12px; margin-bottom:15px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    label { display:block; margin-top:10px; font-weight: bold; }
    input, select, button { width: 100%; padding:12px; margin-top:8px; border-radius:8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; }
    button { background:#4CAF50; color:white; border:none; font-weight:bold; cursor:pointer; }
    .btn-delete { background: #ff4d4d; width: auto; padding: 5px 10px; margin: 0; }
    ul { padding: 0; list-style: none; }
    li { background: #f9f9f9; margin-bottom: 10px; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #4CAF50; }
  </style>
</head>
<body>

  <h1>🕒 Mis Recordatorios</h1>

  <div class="card">
    <button onclick="solicitarPermiso()" style="background:#2196F3; margin-bottom: 10px;">1. Activar Notificaciones</button>
    
    <h3>Agregar recordatorio</h3>
    <label>Tipo</label>
    <select id="tipo">
      <option value="Medicamento">💊 Medicamento</option>
      <option value="Comida">🍎 Comida</option>
    </select>

    <label>Nombre</label>
    <input type="text" id="nombre" placeholder="Ej: Jardiance 10 mg" />

    <label>Hora</label>
    <input type="time" id="hora" />

    <button id="btnGuardar" onclick="agregar()">💾 Guardar recordatorio</button>
  </div>

  <div class="card">
    <h3>Lista de recordatorios</h3>
    <ul id="lista"></ul>
  </div>

<script>
    let recordatorios = JSON.parse(localStorage.getItem('recordatorios')) || [];
    let ultimasNotificaciones = {};
    let swReg = null;

    // Registrar Service Worker para Android
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(reg => {
          swReg = reg;
          console.log("Service Worker listo");
        })
        .catch(err => alert("Error Service Worker: " + err));
    }

    async function solicitarPermiso() {
      const permiso = await Notification.requestPermission();
      alert("Permiso de notificaciones: " + permiso);
    }

    function agregar() {
      try {
        const tipo = document.getElementById('tipo').value;
        const nombre = document.getElementById('nombre').value;
        const hora = document.getElementById('hora').value;

        if (!nombre || !hora) {
          alert('Por favor completa Nombre y Hora');
          return;
        }

        const nuevo = { tipo, nombre, hora, id: Date.now() };
        recordatorios.push(nuevo);
        
        localStorage.setItem('recordatorios', JSON.stringify(recordatorios));
        
        // Limpiar campos y actualizar lista
        document.getElementById('nombre').value = '';
        mostrar();
        alert("✅ Guardado correctamente");
      } catch (error) {
        alert("Error al guardar: " + error);
      }
    }

    function borrar(id) {
      recordatorios = recordatorios.filter(r => r.id !== id);
      localStorage.setItem('recordatorios', JSON.stringify(recordatorios));
      mostrar();
    }

    function mostrar() {
      const lista = document.getElementById('lista');
      lista.innerHTML = '';
      
      recordatorios.sort((a, b) => a.hora.localeCompare(b.hora));

      recordatorios.forEach(r => {
        const li = document.createElement('li');
        // USANDO BACKTICKS CORRECTAMENTE
        li.innerHTML = `
          <span><strong>${r.hora}</strong> - ${r.nombre}</span>
          <button class="btn-delete" onclick="borrar(${r.id})">Borrar</button>
        `;
        lista.appendChild(li);
      });
    }

    function verificar() {
      const ahora = new Date();
      const horaActual = ahora.toTimeString().slice(0, 5);

      recordatorios.forEach(r => {
        if (r.hora === horaActual && ultimasNotificaciones[r.id] !== horaActual) {
          enviarAlerta(r);
          ultimasNotificaciones[r.id] = horaActual;
        }
      });
    }

    function enviarAlerta(r) {
      const titulo = "⏰ Recordatorio de Salud";
      const texto = `${r.tipo}: ${r.nombre}`;

      if (swReg && Notification.permission === 'granted') {
        swReg.showNotification(titulo, { 
            body: texto, 
            icon: 'https://cdn-icons-png.flaticon.com/512/504/504230.png',
            vibrate: [200, 100, 200]
        });
      } else {
        // Si falla la notificación, al menos suena un alert
        alert("RECORDATORIO: " + texto);
      }
    }

    setInterval(verificar, 30000);
    mostrar();
</script>
</body>
</html>
